<!DOCTYPE html>

<html lang="zh-CN">
  <head>
    <title>注册一个网站</title>
  </head>

  <body>

    <form action="#">   
      <h2>注册</h2>
      <label for="username">username:</label>
      <input id="username" name="username" type="text" placeholder="Please enter your username."><br><br>
      <label for="email">email:</label>
      <input id="email" name="email" type="email" placeholder="Please enter your email."><br><br>
      <label for="password">password:</label>
      <input id="password" name="password" type="password" placeholder="Please enter your password."><br><br>

      <h2>性别</h2>
      <label><input type="radio" name="gender" value="male">男</label>
      <label><input type="radio" name="gender" value="female">女</label>
      <label><input type="radio" name="gender" value="other">其他</label>
      <label><input type="radio" name="gender" value="not_to_say">保密</label>

      <h2>喜欢的食物</h2>
      <label><input type="checkbox" name="food" value="chips">薯片</label>
      <label><input type="checkbox" name="food" value="sunflower_seeds">瓜子</label>
      <label><input type="checkbox" name="food" value="popcorn">爆米花</label>
      <label><input type="checkbox" name="food" value="squid_shreds">鱿鱼丝</label><br><br>

      <input type="submit" value="提交">
    </form>
  
  </body>

</html>
